global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'aegis-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'api-gateway:8080'
          - 'core-banking:8081'
          - 'fraud-service:8083'
          - 'notification-service:8084'
          - 'identity-service:8085'
