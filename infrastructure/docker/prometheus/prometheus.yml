global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'aegis-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          # Spring Boot services run on the Windows host through start-backend.bat.
          # Docker Desktop resolves host.docker.internal to that host.
          - 'host.docker.internal:8084' # API Gateway
          - 'host.docker.internal:8081' # Core Banking
          - 'host.docker.internal:8082' # Fraud Service
          - 'host.docker.internal:8083' # Notification Service
          - 'host.docker.internal:8085' # Identity Service
