spring.application.name=core-banking
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:15432/aegis_core
spring.datasource.username=keycloak
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.table=flyway_core_banking
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true
spring.flyway.url=jdbc:postgresql://localhost:15432/aegis_core
spring.flyway.user=keycloak
spring.flyway.password=${db.password}
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.aegis=DEBUG
# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/aegis
fraud.service.url=http://localhost:8082

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Vault Configuration
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.token=root
spring.config.import=vault://

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=16379
