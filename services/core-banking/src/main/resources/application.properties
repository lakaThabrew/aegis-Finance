spring.application.name=core-banking
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:15432/aegis_core
spring.datasource.username=keycloak
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.table=flyway_core_banking
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true
spring.flyway.url=jdbc:postgresql://localhost:15432/aegis_core
spring.flyway.user=keycloak
spring.flyway.password=password
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.aegis=DEBUG

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/aegis

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
