spring.application.name=identity-service
server.port=8085

# Database
spring.datasource.url=jdbc:postgresql://localhost:15432/aegis_identity
spring.datasource.username=keycloak
spring.datasource.password=${db.password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.table=flyway_identity_service
spring.flyway.baseline-on-migrate=true
spring.flyway.url=jdbc:postgresql://localhost:15432/aegis_identity
spring.flyway.user=keycloak
spring.flyway.password=${db.password}
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=fraud-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.aegis=DEBUG

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# Vault Configuration
spring.cloud.vault.uri=http://localhost:8200
spring.cloud.vault.token=root
spring.config.import=vault://

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=16379
